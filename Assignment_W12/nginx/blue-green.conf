# nginx/blue-green.conf
# Nginx reverse proxy config for blue-green traffic switching.
# Author: Aayush Kathiriya | Week 12 — ITUE301
#
# To switch traffic from BLUE to GREEN:
#   1. Change upstream server from backend-blue:5000  ->  backend-green:5000
#   2. Run: docker-compose exec nginx nginx -s reload
#   3. Verify: curl http://localhost:8080/version  ->  {"version":"green"}
#
# This file is mounted as a volume — changes take effect with nginx reload,
# NOT a container restart — achieving zero-downtime traffic switching.

upstream task_backend {
  # ── ACTIVE SLOT ──────────────────────────────────────────────────────────
  # Change this line to switch between blue and green.
  # Current: BLUE (port 5000) is live.
  server backend-blue:5000;

  # To switch to GREEN — uncomment the line below and comment out BLUE:
  # server backend-green:5000;

  keepalive 32;
}

server {
  listen 80;
  server_name localhost;

  # Proxy all traffic to the active upstream slot
  location / {
    proxy_pass         http://task_backend;
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Timeouts
    proxy_connect_timeout  5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Add deployment colour to response headers (for debugging)
    add_header X-Proxy-Upstream $upstream_addr always;
  }

  # Health check endpoint for load balancer / monitoring
  location /nginx-health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
